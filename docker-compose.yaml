services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: web
    environment:
      - NODE_ENV=development
      - PORT=3000
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: admin
    environment:
      - NODE_ENV=development
      - PORT=3005
    ports:
      - "3005:3005"
